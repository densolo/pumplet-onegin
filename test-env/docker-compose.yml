# Local test environment: a "remote" source DB and a local target DB with the same schema, empty.
#   docker compose -f test-env/docker-compose.yml up -d
name: pumplet-onegin-test

services:
  pg-src:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: src-admin-pw
    ports: ["55432:5432"]
    volumes:
      - ./source-init.sql:/docker-entrypoint-initdb.d/01-source-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30

  pg-dst:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dst-pw
    ports: ["55433:5432"]
    volumes:
      # Empty schema, as Liquibase would create it before a copy.
      - ./target-init.sql:/docker-entrypoint-initdb.d/01-target-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30
